services:
  database:
    image: postgres:16-alpine
    container_name: autocare-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-autocare}
      POSTGRES_USER: ${DB_USER:-autocare_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    ports:
      - '5432:5432'
    volumes:
      - autocare-datos:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-autocare_user} -d ${DB_NAME:-autocare}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      args:
        NPM_STRICT_SSL: ${NPM_STRICT_SSL:-true}
    container_name: autocare-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-autocare}
      DB_USER: ${DB_USER:-autocare_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_this_password}
      FRONTEND_URL: http://localhost:5173
    ports:
      - '3000:3000'
    # Recarga automatica durante el desarrollo
    command: node --watch src/server.js
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NPM_STRICT_SSL: ${NPM_STRICT_SSL:-true}
    container_name: autocare-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - '5173:5173'
    # Recarga automatica durante el desarrollo
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  autocare-datos:
