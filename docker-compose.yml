services:
  database:
    image: postgres:16-alpine
    container_name: autocare-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-autocare}
      POSTGRES_USER: ${DB_USER:-autocare_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
    ports:
      - '${HOST_DB_PORT:-5435}:5432'

    volumes:
      - autocare-datos:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-autocare_user} -d ${DB_NAME:-autocare}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      args:
        NPM_STRICT_SSL: ${NPM_STRICT_SSL:-true}
    container_name: autocare-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-autocare}
      DB_USER: ${DB_USER:-autocare_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_this_password}
      FRONTEND_URL: http://localhost:5173
      # Secretos y configuracion: se reciben del entorno (.env de la raiz),
      # nunca escritos como credenciales reales aqui.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Pasarela de pagos del modulo de repuestos (PayPal Sandbox / modo simulado).
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}
      PAGOS_MODO_SIMULADO: ${PAGOS_MODO_SIMULADO:-true}
      PAGOS_MONEDA: ${PAGOS_MONEDA:-USD}
    ports:
      - '3000:3000'
    # Recarga automatica durante el desarrollo
    command: node --watch src/server.js
    volumes:
      - ./backend:/app
      # Las migraciones (fuera del contexto del backend) se montan de solo lectura
      # para que el runner de migraciones pueda aplicarlas al arrancar.
      - ./database/migrations:/app/database/migrations:ro
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NPM_STRICT_SSL: ${NPM_STRICT_SSL:-true}
        # Las variables VITE_* se incorporan durante el build; se pasan como build arg.
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: autocare-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000/api
      # En el servidor de desarrollo de Vite, la variable tambien se toma del entorno.
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - '5173:5173'
    # Recarga automatica durante el desarrollo
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  autocare-datos:
